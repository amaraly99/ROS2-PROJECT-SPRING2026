# ViSP Servo Parameters — non-HIL real-camera defaults (v4: translation-only).
# Mirror of hil_servo_params.yaml with more conservative caps for real hardware.
# State machine: SEARCHING → APPROACHING ↔ REACQUIRE → REACHED.
visp_servo_node:
  ros__parameters:
    # ── Target selection ──────────────────────────────────────
    target_class: "stop sign"
    min_confidence: 0.30
    image_width:  640
    image_height: 480

    # ── Control gains ────────────────────────────────────────
    k_fwd:           1.0
    k_lat:           0.4
    k_vz:            0.4
    vert_deadband:   0.08
    k_pitch_return:  1.0
    pitch_zero_tol:  0.02

    # ── Velocity / acceleration limits (conservative for real HW) ─
    max_linear:    0.8
    max_angular:   0.5
    vel_ramp_rate: 0.30

    # ── Approach termination ──────────────────────────────────
    target_bbox_ratio:  0.55
    hold_bbox_ratio:    0.50
    hold_center_tol:    0.12
    reach_consec_ticks: 8

    # ── Lock-on ───────────────────────────────────────────────
    lockon_consec:  3
    lockon_ex_tol:  0.5
    k_lockon_bias:  0.5

    # ── Search behavior ──────────────────────────────────────
    search_yaw_target_deg:     60.0
    k_search_yaw:               0.8
    search_yaw_arrive_tol_rad:  0.05
    search_settle_sec:          0.5
    search_strafe_speed:        0.4
    search_strafe_dur_sec:      3.0

    # ── REACQUIRE adaptive timeout ────────────────────────────
    base_reacquire_sec: 1.0
    k_persist:          0.3
    max_reacquire_sec:  5.0

    # ── Sim liveness ──────────────────────────────────────────
    # Real hardware won't publish /sim/heartbeat; controller treats absence
    # of heartbeat as healthy (grace state) so this section is mostly inert.
    heartbeat_window_samples:  20
    heartbeat_gap_sec:         0.2
    heartbeat_dead_sec:        1.5
    sim_paused_rate:           0.01
    sim_unhealthy_entry_sec:   1.0
    sim_recovery_debounce_sec: 0.5

    # ── Floor safety ──────────────────────────────────────────
    safety_min_altitude: 0.5
    safety_pose_max_age: 2.0

    # ── Watchdog & diagnostics ────────────────────────────────
    watchdog_period_sec: 0.20
    diag_period_sec:     2.0

    # ── Misc ──────────────────────────────────────────────────
    smoothing_window:    5
    debug_min_draw_conf: 0.15
