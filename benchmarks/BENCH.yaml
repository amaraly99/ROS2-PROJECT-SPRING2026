# Leave empty to use the script defaults:
#   workspace_root -> /workspace when available, otherwise the repo root
#   dataset_root   -> <workspace_root>/datasets/euroc
#   output_root    -> <workspace_root>/results/ov2slam_benchmark
workspace_root: ""
dataset_root: ""
output_root: ""

# Leave empty to keep timestamp-based result folders.
results_name: "new_retrail_benchmark_fast"

# Leave empty to use speed/camera-derived default params file.
params_file: ""
camera: stereo
speed: fast
trajectory_policy: paper

# Use either `sequences` or `seq_range_start`/`seq_range_end`.
sequences: [MH_05_difficult]
seq_range_start: ""
seq_range_end: ""

node_name: /ov2slam_node
ov2slam_cores: "1,2,3,4"
retries: 2

node_wait_timeout: 45
bag_timeout: 1200
auto_exit_timeout: 600
sigint_timeout: 30

startup_settle_sec: 2
inter_run_delay_sec: 10
monitor_sample_sec: 0.05
