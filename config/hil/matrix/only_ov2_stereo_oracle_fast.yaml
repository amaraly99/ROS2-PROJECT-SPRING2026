# Single-arm SLAM-isolation experiment: STEREO OV2SLAM, FAST-tuned profile,
# oracle detector, proportional controller. Copy of only_ov2_stereo_oracle.yaml
# (the accurate-tuned stereo arm) with the arm pointed at the fast stereo stack
# config + calib created 2026-09-08. Everything else identical on purpose.
#
#   py scripts\hil_matrix\run_matrix.py --config only_ov2_stereo_oracle_fast --dry-run
#   py scripts\hil_matrix\run_matrix.py --config only_ov2_stereo_oracle_fast --doctor
#   py scripts\hil_matrix\run_matrix.py --config only_ov2_stereo_oracle_fast --trials 1

# --- what to fly ----------------------------------------------------------
arms:
  - {name: ov2_stereo_oracle_fast, config: ov2slam_stereo_oracle_fast, scene: parking_lot_far, dds: fastrtps, stereo: true, init_patience_sec: 60}

trials: 10          # trials PER ARM
vx: 2.0            # mission cruise speed, m/s
run_tag: ''        # bag name prefix; the arm name is appended automatically

# --- evaluation -----------------------------------------------------------
end_pad: 3

# --- gates ----------------------------------------------------------------
min_free_mb: 8000      # below this Simulink stops holding real time
min_poses: 20          # non-zero /slam/pose in the bag; fewer means no map
pacing_lo: 0.85        # sim-time advance per wall second
pacing_hi: 1.15
respawn_tol_m: 2.0     # drone must be back at spawn before a trial starts

# --- hosts and paths ------------------------------------------------------
pi: amaraly@192.168.1.60
pi_repo: ~/ROS2-slam-hil
matlab_dir: C:\Users\homie\Desktop\ROS2-slam-hil\matlab
calib: camera_calib/hil_sim_ov2slam_stereo_fast.yaml
desktop: true
probe_timeout: 400

# Per-eye image type MATLAB sends (rgb = bgr8, mono = mono8). SLAM gets gray either
# way; mono only cuts network bytes. Keep left_image: rgb if the YOLO detector runs.
left_image: rgb
right_image: rgb
