# OV2SLAM fast, stereo, SLAM CPU pinning removed. 0.61m baseline.
# Cloned from only_ov2_stereo_oracle_fast.yaml for the ALICIA unpinned batch.
arms:
  - {name: ov2_stereo_oracle_fast_nopin, config: ov2slam_stereo_oracle_fast_nopin, scene: parking_lot_far, dds: fastrtps, stereo: true, init_patience_sec: 60}

trials: 10
