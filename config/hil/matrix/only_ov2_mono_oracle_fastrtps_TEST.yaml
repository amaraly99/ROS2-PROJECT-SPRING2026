# THROWAWAY diagnostic variant -- MONO oracle (no stereo), FastRTPS, run
# through TODAY's exact branch/session/Pi containers, to isolate whether
# stereo mode itself (not RMW implementation) is what freezes
# /sim/drone_pose. 2026-09-05. Delete once the test is done.
#
#   py scripts\hil_matrix\run_matrix.py --config only_ov2_mono_oracle_fastrtps_TEST --trials 1

arms:
  - {name: ov2_mono_oracle_fastrtps, config: ov2slam_oracle_accurate_fastrtps_TEST, scene: parking_lot_far, dds: fastrtps, stereo: false, init_patience_sec: 60}

trials: 1
vx: 2.0
run_tag: ''

end_pad: 3

min_free_mb: 8000
min_poses: 20
pacing_lo: 0.85
pacing_hi: 1.15
respawn_tol_m: 2.0

pi: amaraly@192.168.1.60
pi_repo: ~/ROS2-slam-hil
matlab_dir: C:\Users\homie\Desktop\ROS2-slam-hil\matlab
calib: camera_calib/hil_sim_ov2slam_accurate.yaml
desktop: true
probe_timeout: 400
