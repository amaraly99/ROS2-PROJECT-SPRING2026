# All 4 mono SLAM arms, UNPINNED, over WiFi/FastRTPS -- 2026-09-15.
# Companion to only_mono_all_2026-09-08.yaml (the PINNED version). Built so
# mono has an unpinned baseline comparable to the ALICIA stereo batch (all 5
# stereo backends ran unpinned, see HANDOFF.md Part J -- confirmed this
# session directly from each ALICIA run's own snapshotted configs/, not just
# from the handoff's prose).
#
# Each arm points at a new *_nopin_wifi.yaml stack config (config/hil/stack/
# on the Pi), built 2026-09-15 from the *_wifi.yaml base (NOT the older
# *_nopin.yaml files, which predate the wifi network fix and still point at
# the dead wired 192.168.137.1/eth0 link -- eth0 confirmed NO-CARRIER/DOWN
# again this session) with only slam.cpu changed from "2,3" to "".
# controller.cpu / detector.cpu deliberately left pinned in every arm, same
# as every other nopin file in this repo -- see FIX-008.
#
# ov2_fast is EXPECTED to abort every trial by design (documented in
# ov2slam_oracle_fast.yaml itself, carried into this arm's stack config
# header): OV2SLAM-fast initialises ~10.7 m into the flight, past the 3 m
# init leg, so every trial should record "did not initialise... tracking_
# state=1" and 0/N. That's the known finding, not a harness failure --
# included for completeness / to reconfirm it still holds unpinned, not
# because a usable score is expected from it.
#
# trials: 10, not the original mono matrix's 3, to match ALICIA's n=10 so the
# eventual mono numbers are directly comparable -- override with --trials if
# a smaller first pass is wanted.
#
#   py scripts\hil_matrix\run_matrix.py --config only_mono_all_nopin --dry-run
#   py scripts\hil_matrix\run_matrix.py --config only_mono_all_nopin --doctor
#   py scripts\hil_matrix\run_matrix.py --config only_mono_all_nopin

# --- what to fly ----------------------------------------------------------
arms:
  - {name: ov2_accurate, config: ov2slam_oracle_accurate_nopin_wifi, scene: parking_lot_far, dds: fastrtps}
  - {name: ov2_fast,      config: ov2slam_oracle_fast_nopin_wifi,     scene: parking_lot_far, dds: fastrtps}
  - {name: orbslam2,      config: orbslam2_probe_nopin_wifi,          scene: parking_lot_far, dds: fastrtps}
  - {name: orbslam3,      config: orbslam3_probe_nopin_wifi,          scene: parking_lot_far, dds: fastrtps}

trials: 10         # trials PER ARM (40 total, round robin) -- matches ALICIA's n=10
vx: 2.0            # mission cruise speed, m/s
run_tag: 'ALICIA_mono'   # bag name prefix; the arm name is appended automatically

# --- evaluation -----------------------------------------------------------
end_pad: 3

# --- gates ----------------------------------------------------------------
min_free_mb: 8000      # below this Simulink stops holding real time
min_poses: 20          # non-zero /slam/pose in the bag; fewer means no map
pacing_lo: 0.85        # sim-time advance per wall second
pacing_hi: 1.15
respawn_tol_m: 2.0     # drone must be back at spawn before a trial starts

# --- hosts and paths ------------------------------------------------------
pi: amaraly@192.168.1.60
pi_repo: ~/ROS2-slam-hil
matlab_dir: C:\Users\homie\Desktop\ROS2-slam-hil\matlab
calib: camera_calib/hil_sim_ov2slam_accurate.yaml
desktop: true
probe_timeout: 400
