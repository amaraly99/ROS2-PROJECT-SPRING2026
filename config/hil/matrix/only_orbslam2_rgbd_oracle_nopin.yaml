# GRAY variant (option 1): ORB-SLAM2 reads /ovcam, exactly like the RTAB-Map RGB-D milestone. Send mono8 (RGBD_COLOUR_MONO=1).
# ORB-SLAM2 RGB-D (rgbd_hil) HIL arm, created 2026-10-02. Copy of only_orbslam2_stereo_oracle_nopin.yaml.
# Changes: arm/config name, stereo: false, calib -> rgbd/hil_sim_rgbd.yaml, run_tag, matlab via run_matrix_rgbd.py.
# MUST run with run_matrix_rgbd.py (RGB-D Simulink model + depth publisher; Pi side run_stack_hil_rgbd.sh).
#   py scripts\hil_matrix\run_matrix_rgbd.py --config only_orbslam2_rgbd_oracle_nopin --dry-run
#   py scripts\hil_matrix\run_matrix_rgbd.py --config only_orbslam2_rgbd_oracle_nopin --trials 1
# ORB-SLAM2, stereo, SLAM CPU pinning removed. 0.61m baseline.
# Cloned from only_orbslam2_stereo_oracle.yaml for the ALICIA unpinned batch.
arms:
  - {name: orbslam2_rgbd_nopin, config: orbslam2_rgbd_oracle_nopin_wifi, scene: parking_lot_far, dds: fastrtps, stereo: false, init_patience_sec: 60}

trials: 10
vx: 2.0
run_tag: 'RGBD_ORB2'

end_pad: 3

min_free_mb: 8000
min_poses: 20
pacing_lo: 0.85
pacing_hi: 1.15
respawn_tol_m: 2.0

pi: amaraly@192.168.1.60
pi_repo: ~/ROS2-slam-hil
matlab_dir: C:\Users\homie\Desktop\ROS2-slam-hil\matlab
calib: src/orbslam2/ros2-ORB_SLAM2/src/rgbd/hil_sim_rgbd.yaml
desktop: true
probe_timeout: 400
