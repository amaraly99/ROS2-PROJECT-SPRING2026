# DIAGNOSTIC ONLY -- NOT a reportable profile.
#
# This is OV2SLAM's fast profile with ONE knob flipped: use_clahe 0 -> 1.
# Its only purpose is to test the hypothesis that the fast profile's init
# failure on the synthetic scene is caused by CLAHE being off (feature
# instability on low-contrast imagery), NOT by insufficient parallax.
#
# WITH CLAHE ON, THIS IS NO LONGER "FAST MODE." Do not report its numbers as
# OV2SLAM-fast -- that would misrepresent the profile. If it initialises near
# ~0.5 m (like the accurate profile), CLAHE was the gate. If it still fails at
# ~10.7 m, the cause is elsewhere. Either way the answer is a labelled
# diagnostic sentence, never a results-table row.
#
# Teardown when done:
#   rm config/hil/stack/ov2slam_fast_clahe_diag.yaml
#   rm camera_calib/hil_sim_ov2slam_fast_clahe.yaml   (both on the Pi)
#   rm config/hil/matrix/only_ov2_fast_clahe.yaml     (this file, on Windows)
#
#   py scripts\hil_matrix\run_matrix.py --config only_ov2_fast_clahe --trials 1

# --- what to fly ----------------------------------------------------------
arms:
  - {name: ov2_fast_clahe, config: ov2slam_fast_clahe_diag, scene: parking_lot_far}

trials: 1           # a single flight is enough to see where it initialises
vx: 2.0
run_tag: clahe_diag

# --- evaluation -----------------------------------------------------------
end_pad: 3

# --- gates ----------------------------------------------------------------
min_free_mb: 8000
min_poses: 20
pacing_lo: 0.85
pacing_hi: 1.15
respawn_tol_m: 2.0

# --- hosts and paths ------------------------------------------------------
pi: amaraly@192.168.137.10
pi_repo: ~/ROS2-PROJECT-SPRING2026
matlab_dir: c:\Users\homie\Desktop\ROS2-PROJECT-SPRING2026\matlab
calib: camera_calib/hil_sim_ov2slam_accurate.yaml
desktop: true
probe_timeout: 400
