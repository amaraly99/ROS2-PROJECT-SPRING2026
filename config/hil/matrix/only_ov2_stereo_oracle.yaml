# Single-arm SLAM-isolation experiment: stereo OV2SLAM, oracle detector,
# proportional controller. Detector and controller are both "perfect" here
# on purpose, so a bad result is SLAM's own fault, not detector/controller
# noise. Mirrors config/hil/matrix/only_ov2_fast.yaml's structure (the
# equivalent mono single-arm scrutiny config).
#
#   py scripts\hil_matrix\run_matrix.py --config only_ov2_stereo_oracle --dry-run
#   py scripts\hil_matrix\run_matrix.py --config only_ov2_stereo_oracle --doctor
#   py scripts\hil_matrix\run_matrix.py --config only_ov2_stereo_oracle --trials 1

# --- what to fly ----------------------------------------------------------
# stereo: true is required here -- without it MATLAB never enables the
# right-eye camera at all (set_stereo.m, commented-out/inert by default),
# and the right-eye relay waits forever for frames that never arrive. Found
# and fixed live, see run_matrix.py's start_stack().
# init_patience_sec: 60 -- stereo's own "ready" signal climbs gradually
# (real log evidence: 0->1->3->7->13->50 3D points, crossing the ready
# threshold well past the default ~9s budget). 60s comfortably covers the
# observed crossing point with real margin. Every other existing matrix
# config leaves this unset (defaults to 9s, unchanged) on purpose.
arms:
  - {name: ov2_stereo_oracle, config: ov2slam_stereo_oracle, scene: parking_lot_far, dds: fastrtps, stereo: true, init_patience_sec: 60}

trials: 10          # trials PER ARM
vx: 2.0            # mission cruise speed, m/s
run_tag: ''        # bag name prefix; the arm name is appended automatically

# --- evaluation -----------------------------------------------------------
end_pad: 3

# --- gates ----------------------------------------------------------------
min_free_mb: 8000      # below this Simulink stops holding real time
min_poses: 20          # non-zero /slam/pose in the bag; fewer means no map
pacing_lo: 0.85        # sim-time advance per wall second
pacing_hi: 1.15
respawn_tol_m: 2.0     # drone must be back at spawn before a trial starts

# --- hosts and paths ------------------------------------------------------
# pi / pi_repo / matlab_dir corrected here vs only_ov2_fast.yaml, which still
# has the old wired-network address, the old pre-migration repo path, and
# the loosely-related feat/stereo-hil-posefix checkout. This arm uses the
# current Pi address, the ROS2-slam-hil worktree actually used all session,
# and the new matching Windows worktree (see docs/fixlog on the Pi, FIX-024
# session, "Windows worktree" plan). Not fixed in only_ov2_fast.yaml itself
# — out of scope, that file's own experiment still works as-is.
pi: amaraly@192.168.1.60
pi_repo: ~/ROS2-slam-hil
matlab_dir: C:\Users\homie\Desktop\ROS2-slam-hil\matlab
calib: camera_calib/hil_sim_ov2slam_stereo.yaml
desktop: true
probe_timeout: 400

# Per-eye image type MATLAB sends (rgb = bgr8, mono = mono8). SLAM gets gray either
# way; mono only cuts network bytes. Keep left_image: rgb if the YOLO detector runs.
left_image: rgb
right_image: rgb
