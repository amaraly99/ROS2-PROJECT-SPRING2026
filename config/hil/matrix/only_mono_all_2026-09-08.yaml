# All 4 mono SLAM arms, 3 trials each -- 2026-09-08, follow-up to the stereo
# 5-arm/3-trial matrix, to compare mono vs stereo on the same rig tonight.
#
# Every arm points at a *_wifi.yaml stack config, not the project's original
# (proven, historically wired) orbslam2_probe / orbslam3_probe /
# ov2slam_oracle_accurate / ov2slam_oracle_fast. Reason: `ip addr show eth0` on
# the Pi shows NO-CARRIER / state DOWN right now, and a live ping to
# 192.168.137.10 got 100% loss -- the wired link those originals hardcode is
# physically down tonight. The *_wifi variants are byte-identical to the
# originals except the network block (-> 192.168.1.201 / fastrtps, the profile
# every stereo arm used tonight) and, for ORB-SLAM2 only, an ld_prefix fix
# (adds Thirdparty/g2o/lib, needed because `mono` was rebuilt tonight in the
# same colcon pass as `stereo` against host-persisted libs -- see that stack
# config's own header comment for the full reasoning).
#
# ov2_fast is EXPECTED to abort every trial by design (documented in
# ov2slam_oracle_fast.yaml itself, carried into the _wifi variant's header):
# OV2SLAM-fast initialises ~10.7 m into the flight, past the 3 m init leg, so
# every trial should record "did not initialise... tracking_state=1" and 0/N.
# That's the known finding, not a harness failure -- included for completeness
# / to reconfirm it still holds on this worktree+network, not because a usable
# score is expected from it.
#
#   py scripts\hil_matrix\run_matrix.py --config only_mono_all_2026-09-08 --dry-run
#   py scripts\hil_matrix\run_matrix.py --config only_mono_all_2026-09-08 --doctor
#   py scripts\hil_matrix\run_matrix.py --config only_mono_all_2026-09-08

# --- what to fly ----------------------------------------------------------
# Round robin across arms (A1,B1,C1,D1, A2,B2,...) per run_matrix.py's own
# design, so session drift spreads evenly -- same reasoning as tonight's
# stereo matrix, which is exactly what caught a real thermal/CPU trend.
arms:
  - {name: ov2_accurate, config: ov2slam_oracle_accurate_wifi, scene: parking_lot_far, dds: fastrtps}
  - {name: ov2_fast,      config: ov2slam_oracle_fast_wifi,     scene: parking_lot_far, dds: fastrtps}
  - {name: orbslam2,      config: orbslam2_probe_wifi,          scene: parking_lot_far, dds: fastrtps}
  - {name: orbslam3,      config: orbslam3_probe_wifi,          scene: parking_lot_far, dds: fastrtps}

trials: 3          # trials PER ARM (12 total, round robin)
vx: 2.0            # mission cruise speed, m/s
run_tag: ''        # bag name prefix; the arm name is appended automatically

# --- evaluation -----------------------------------------------------------
end_pad: 3

# --- gates ----------------------------------------------------------------
min_free_mb: 8000      # below this Simulink stops holding real time
min_poses: 20          # non-zero /slam/pose in the bag; fewer means no map
pacing_lo: 0.85        # sim-time advance per wall second
pacing_hi: 1.15
respawn_tol_m: 2.0     # drone must be back at spawn before a trial starts

# --- hosts and paths ------------------------------------------------------
pi: amaraly@192.168.1.60
pi_repo: ~/ROS2-slam-hil
matlab_dir: C:\Users\homie\Desktop\ROS2-slam-hil\matlab
# Backup/restore safety net around the WHOLE matrix run only (never read
# per-arm) -- see only_stereo_all_2026-09-08.yaml's own comment on this field.
calib: camera_calib/hil_sim_ov2slam_accurate.yaml
desktop: true
probe_timeout: 400
