# bench_fsm.yaml — SHARED FSM / filter / geometry parameters.
#
# Applied to BOTH test subjects (TS1 visp_servo IBVS, TS2 hil_servo
# proportional) so the state machine, safety filters and camera geometry
# are identical. The ONLY per-subject file is the controller gains file
# (bench_ibvs.yaml / bench_proportional.yaml), passed AFTER this one.
#
# `/**` wildcard → applies to any node name (visp_servo_node OR hil_servo_node).
#
# Coordinate convention (Simulink-confirmed):
#   linear.x = forward(+)  linear.y = LEFT(+)  linear.z = UP(+)
#   angular.y = pitch rate (+ nose down)   angular.z = yaw rate (+ left)
# Drone ICs: x=0, y=15, z=10, yaw=0, pitch=0.  Target: (35.5, 23.7, 3.2, pi).
/**:
  ros__parameters:
    # ── Target selection ──
    target_class: "stop sign"
    min_confidence: 0.20
    image_width:  640
    image_height: 480

    # ── Sim camera intrinsics (hil_ros_init_LT: fx=fy=554, cx=320, cy=240) ──
    cam_fx: 554.0
    cam_fy: 554.0
    cam_cx: 320.0
    cam_cy: 240.0
    known_target_height: 1.5   # metres (sedan); also used for IBVS desired depth

    # ── Camera leveling (shared, added by FSM not the servoing law) ──
    k_pitch_return:  1.0
    pitch_zero_tol:  0.02

    # ── Velocity / acceleration limits (IDENTICAL across subjects → fair) ──
    max_linear:    3.0
    max_angular:   0.8
    vel_ramp_rate: 1.5

    # ── Approach termination / REACHED ──
    target_bbox_ratio:  0.55
    hold_bbox_ratio:    0.50
    hold_center_tol:    0.12
    reach_consec_ticks: 8

    # ── Lock-on (SEARCHING → APPROACHING) ──
    lockon_consec:  2
    lockon_ex_tol:  0.5
    k_lockon_bias:  0.5

    # ── Search behavior ──
    search_yaw_target_deg:     60.0
    k_search_yaw:               1.0
    search_yaw_arrive_tol_rad:  0.05
    search_settle_sec:          0.5
    search_strafe_speed:        0.6
    search_strafe_dur_sec:      3.0

    # ── REACQUIRE adaptive timeout ──
    base_reacquire_sec: 1.0
    k_persist:          0.3
    max_reacquire_sec:  5.0

    # ── Sim liveness (heartbeat watchdog) ──
    heartbeat_window_samples:  20
    heartbeat_gap_sec:         0.2
    heartbeat_dead_sec:        1.5
    sim_paused_rate:           0.01
    sim_unhealthy_entry_sec:   1.0
    sim_recovery_debounce_sec: 0.5

    # ── Floor safety ──
    safety_min_altitude: 0.5
    safety_pose_max_age: 2.0

    # ── Watchdog / diagnostics ──
    watchdog_period_sec: 0.20
    diag_period_sec:     2.0
    smoothing_window:    5