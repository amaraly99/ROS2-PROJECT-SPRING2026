# Benchmark variant — OV2SLAM + YOLO + ViSP IBVS with SLAM DEPTH (scout).
# A/B pair with ov2slam_ibvs.yaml: IDENTICAL stack, only controller.use_slam_depth flips.
# Here IBVS gets its interaction-matrix depth from OV2SLAM map points (/slam/cloud)
# projected via the SLAM pose (/slam/pose), instead of bbox depth. Compare RMSE vs baseline.
mode: scout

network:
  matlab_host_ip: 192.168.1.201
  interface:      wlan0
  dds:            cyclonedds
  ros_domain_id:  0

detector:
  type:     yolo
  cpu:      "1"
  host_cpu: "1"
  yolo:
    hef:        /workspace/models/yolo26n_10h.hef
    confidence: 0.20

controller:
  type: ibvs
  cpu:  "0"
  use_slam_depth: true         # SLAM DEPTH: map-point median in bbox (A/B pair: ov2slam_ibvs)

slam:
  enabled:           true
  type:              ov2slam
  image:             ros2_perception_stack
  container_name:    slam_ov2slam
  cpu:               "2,3"
  startup_delay_sec: 15
  restart:           unless-stopped
  # Direct binary path, not "ros2 run" -- see ov2slam_oracle.yaml for why.
  command:           "/workspace/install/ov2slam/lib/ov2slam/ov2slam_node /workspace/camera_calib/hil_sim_ov2slam.yaml"
  topics:
    image_in: /ovcam/image_raw
    pose_out: /slam/pose
  remap:
    - "/ovcam/image_raw:=/ovcam/image_raw"
    - "vo_pose:=/slam/pose"
    - "point_cloud:=/slam/cloud"
