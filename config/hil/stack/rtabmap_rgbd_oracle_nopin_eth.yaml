# ============================================================================
# HIL Stack Config — "rtabmap_rgbd_oracle_nopin_eth"   (created 2026-09-27, wired copy of _wifi)
#
# RGB-D copy of rtabmap_stereo_oracle_nopin (ETHERNET profile, MATLAB 192.168.137.1), for milestone 1 of
# ~/RGBD_HIL_PLAN.md: ORACLE detector + proportional controller + the RTAB-Map
# sidecar running src/rtabmap_docker/hil_rgbd.launch.py (rgbd_odometry + rtabmap +
# hil_rgbd_bridge.py). Network/detector/controller/SLAM-container blocks are copied
# verbatim from rtabmap_stereo_oracle_nopin.yaml.wifibak; only camera + command change.
#
# START IT WITH run_stack_hil_rgbd.sh (NOT run_stack_hil.sh): the RGB-D copy keeps
# the left image on the MATLAB source stamp so it pairs with the depth topic.
#   ./run_stack_hil_rgbd.sh --config rtabmap_rgbd_oracle_nopin_eth --mode benchmark --hold-fsm
#
# Requires the RGB-D Simulink model publishing /sim/camera/depth/image_raw
# (16UC1 mm, LEFT camera, same stamp as /sim/camera/image_raw; set_rgbd.m).
# ============================================================================

mode: benchmark

# ── Global / network ─────────────────────────────────────────────────────────
network:
  matlab_host_ip: 192.168.137.1
  interface:      ""              # auto-detect via routing table toward matlab_host_ip
  dds:            fastrtps
  ros_domain_id:  0

# ── camera ────────────────────────────────────────────────────────────────────
camera:
  stereo: false   # RGB-D uses the left camera only (+ its depth); read by run_stack_hil_rgbd.sh
  rgbd:   true    # informational: run_stack_hil.sh / parse_stack.py ignore this key

# ── Module 1: DETECTION ──────────────────────────────────────────────────────
detector:
  type: oracle
  cpu:  "0"

# ── Module 2: CONTROLLER ─────────────────────────────────────────────────────
controller:
  type: proportional
  cpu:  "0"

# ── Module 3: SLAM ───────────────────────────────────────────────────────────
slam:
  enabled:           true
  type:              rtabmap
  image:             rtabmap-jazzy-arm64:latest
  container_name:    slam_rtabmap
  startup_delay_sec: 2
  restart:           unless-stopped

  # run_stack_hil.sh prepends /workspace/opencv/build/lib (the custom OpenCV 4.10
  # this repo's OV2SLAM uses) to every sidecar's LD_LIBRARY_PATH. rtabmap in this
  # image links OpenCV 4.6 (different soname, so no clash), but keep the image's
  # own system libs first regardless.
  ld_prefix:     /usr/lib/aarch64-linux-gnu:/opt/ros/jazzy/lib

  # bash -c wrapper: run_stack_hil.sh appends `--ros-args <remaps>` to every
  # command; `ros2 launch` would reject that as a malformed launch argument, so
  # the appended tail must land in bash's $0 instead (same trick the ORB-SLAM3
  # configs rely on). exec keeps the launch process as PID 1 for docker stop.
  command: >-
    bash -c "exec ros2 launch /workspace/src/rtabmap_docker/hil_rgbd.launch.py"

  topics:
    image_in: /ovcam/image_raw
    pose_out: /slam/pose

# ── SLAM-init gate ────────────────────────────────────────────────────────────
init_gate:
  enabled: false
  module: none
