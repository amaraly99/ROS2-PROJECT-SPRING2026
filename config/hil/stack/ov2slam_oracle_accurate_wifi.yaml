# SLAM RMSE capture — OV2SLAM (ACCURATE profile), MONO, over WiFi/FastRTPS.
# Byte-identical to ov2slam_oracle_accurate.yaml (which is hardwired to the
# 192.168.137.1/eth0/cyclonedds link) except the network block, which is swapped
# to the WiFi/FastRTPS profile every stereo config used tonight -- created
# 2026-09-08 because eth0 is currently physically down on the Pi (`ip addr show
# eth0` -> NO-CARRIER, state DOWN; a live ping to 192.168.137.10 got 100% loss).
# Everything else (detector/controller/slam command/remaps/init_gate) unchanged.
mode: benchmark

network:
  matlab_host_ip: 192.168.1.201
  interface:      ""              # auto-detect via routing table toward matlab_host_ip
  dds:            fastrtps
  ros_domain_id:  0

detector:
  type: oracle
  cpu:  "0"

controller:
  type: proportional
  cpu:  "0"

slam:
  enabled:           true
  type:              ov2slam
  image:             ros2_perception_stack
  container_name:    slam_ov2slam
  cpu:               "2,3"
  startup_delay_sec: 2
  restart:           unless-stopped
  command:           "ros2 run ov2slam ov2slam_node /workspace/camera_calib/hil_sim_ov2slam_accurate.yaml"
  topics:
    image_in: /ovcam/image_raw
    pose_out: /slam/pose
  remap:
    - "/ovcam/image_raw:=/ovcam/image_raw"
    - "vo_pose:=/slam/pose"
    - "slam_tracking_state:=/slam/tracking_state"

init_gate:
  enabled: false
