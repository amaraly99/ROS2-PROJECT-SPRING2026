# Full stack — YOLO + Proportional + OV2SLAM. Closest to real flight. Requires Hailo HAT.
# Lean alias of full_ov2slam.yaml (which is the fully-commented schema reference).
mode: scout

network:
  matlab_host_ip: 192.168.1.201
  interface:      wlan0
  dds:            cyclonedds
  ros_domain_id:  0

detector:
  type:     yolo
  cpu:      "1"
  host_cpu: "1"
  yolo:
    hef:        /workspace/models/yolo26n_10h.hef
    confidence: 0.20

controller:
  type: proportional
  cpu:  "0"

slam:
  enabled:           true
  type:              ov2slam
  image:             ros2_perception_stack
  container_name:    slam_ov2slam
  cpu:               "2,3"
  startup_delay_sec: 15
  restart:           unless-stopped
  command:           "ros2 run ov2slam ov2slam_node /workspace/camera_calib/hil_sim_ov2slam.yaml"
  topics:
    image_in: /ovcam/image_raw
    pose_out: /slam/pose
  remap:
    - "/ovcam/image_raw:=/ovcam/image_raw"
    - "vo_pose:=/slam/pose"
