# HIL Stack Config -- orbslam2_eval
# Oracle detector + proportional controller + ORB-SLAM2 monocular sidecar.
# benchmark mode: records /slam_pose + /sim/drone_pose for offline ATE RMSE.
# Paths inside container: /workspace = $WS (ROS2-PROJECT root), not src/orbslam2/.
mode: benchmark

network:
  matlab_host_ip: 192.168.1.201
  interface:      wlan0
  dds:            cyclonedds
  ros_domain_id:  0

detector:
  type:     oracle
  cpu:      ""
  topics:
    image_in: /ovcam/image_raw
    out:      /yolo/detections

controller:
  type:       proportional
  cpu:        ""
  gains_file: bench_proportional.yaml
  # SLAM-init gate: monocular ORB-SLAM2 needs a lateral baseline to initialize.
  # Hold the FSM in blind search (ignoring the oracle target) until the SLAM
  # sidecar reports tracking OK, so the drone strafes for parallax BEFORE it
  # commits to the forward-dominant approach. Then one full re-sweep re-finds the
  # target and the run proceeds normally, with SLAM tracking the whole approach.
  # max_blind_strafes=2 with the 8s slam.startup_delay_sec below (see docs/fixlog/011
  # TODO-S): shorter delay buys SLAM more alive/warm-up time before the first
  # strafe, so 2 attempts is enough without wasting extra lateral drift.
  blind_until_slam_ready: true
  max_blind_strafes:      2
  topics:
    detections_in: /yolo/detections
    cmd_out:       /cmd_vel

slam:
  enabled:           true
  type:              orbslam2
  image:             orbslam2_fixed
  container_name:    slam_orbslam2
  cpu:               "2,3"
  startup_delay_sec: 8
  restart:           unless-stopped

  # orbslam2_fixed image lacks ldconfig for ROS2 libs -- must set LD_LIBRARY_PATH.
  setup_overlay: /workspace/src/orbslam2/install_stereo/setup.bash
  ld_prefix:     /workspace/src/orbslam2/lib:/usr/local/lib:/opt/ros/jazzy/lib

  # Use binary directly -- ros2 run fails (rclpy missing librcl_action.so in this image).
  command: >-
    /workspace/src/orbslam2/install_stereo/orbslam/lib/orbslam/mono
    /workspace/src/orbslam2/Vocabulary/ORBvoc.txt
    /workspace/src/orbslam2/ros2-ORB_SLAM2/src/monocular/hil_sim.yaml

  topics:
    image_in: /ovcam/image_raw
    pose_out: /slam/pose
  remap:
    - "camera:=/ovcam/image_raw"
    - "slam_pose:=/slam/pose"
    - "slam_tracking_state:=/slam/tracking_state"
