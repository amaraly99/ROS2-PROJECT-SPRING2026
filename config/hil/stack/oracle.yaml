# Oracle scouting — synthetic bbox (no Hailo needed) + IBVS, no SLAM.
# Fastest to start: no yolo_producer, no /dev/hailo0 required.
# Use this to test the control law without the Hailo HAT attached.
matlab_host_ip: 192.168.1.201
dds: cyclonedds
ros_domain_id: 0
controller: ibvs
detector: oracle
slam: false
debug_image: false
interface: wlan0
