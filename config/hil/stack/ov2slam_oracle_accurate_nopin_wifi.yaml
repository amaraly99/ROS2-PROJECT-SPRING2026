# SLAM RMSE capture — OV2SLAM (ACCURATE profile), MONO, UNPINNED, over WiFi/FastRTPS.
# Built 2026-09-15 to give mono an unpinned arm comparable to the ALICIA stereo
# batch (all 5 stereo backends ran unpinned, see HANDOFF.md Part J). Base is
# ov2slam_oracle_accurate_wifi.yaml, NOT ov2slam_oracle_accurate_nopin.yaml --
# the existing _nopin file predates the wifi network fix and still points at
# the dead wired link (`ip addr show eth0` -> NO-CARRIER, state DOWN,
# reconfirmed 2026-09-15). Only change from the _wifi base: slam.cpu "2,3" -> "".
# controller.cpu / detector.cpu deliberately left untouched, same reasoning as
# every other _nopin file in this dir: FIX-008 documents a real regression from
# detector/controller core contention, and an unexplained "NEVER PUT ''''"
# warning on those fields elsewhere in this repo could not be verified this
# session either. Do not unpin them without investigating that warning first.
mode: benchmark

network:
  matlab_host_ip: 192.168.1.201
  interface:      ""              # auto-detect via routing table toward matlab_host_ip
  dds:            fastrtps
  ros_domain_id:  0

detector:
  type: oracle
  cpu:  "0"

controller:
  type: proportional
  cpu:  "0"

slam:
  enabled:           true
  type:              ov2slam
  image:             ros2_perception_stack
  container_name:    slam_ov2slam
  cpu:               ""     # NOPIN: unpinned to match ALICIA stereo protocol
  startup_delay_sec: 2
  restart:           unless-stopped
  command:           "ros2 run ov2slam ov2slam_node /workspace/camera_calib/hil_sim_ov2slam_accurate.yaml"
  topics:
    image_in: /ovcam/image_raw
    pose_out: /slam/pose
  remap:
    - "/ovcam/image_raw:=/ovcam/image_raw"
    - "vo_pose:=/slam/pose"
    - "slam_tracking_state:=/slam/tracking_state"

init_gate:
  enabled: false
