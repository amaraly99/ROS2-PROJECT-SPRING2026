# Integration test — OV2SLAM + YOLO + ViSP IBVS (scout).
# Verifies the SLAM sidecar runs alongside the ViSP controller. Requires Hailo HAT.
# SLAM stays decoupled: it only publishes /slam/pose for recording/eval (no controller
# subscribes). (Nested schema; see full_ov2slam.yaml for the fully-commented reference.)
mode: scout

network:
  matlab_host_ip: 192.168.1.201
  interface:      wlan0
  dds:            cyclonedds
  ros_domain_id:  0

detector:
  type:     yolo
  cpu:      "1"
  host_cpu: "1"
  yolo:
    hef:        /workspace/models/yolo26n_10h.hef
    confidence: 0.20

controller:
  type: ibvs
  cpu:  "0"
  use_slam_depth: false        # BASELINE: bbox depth (A/B pair: ov2slam_ibvs_slamdepth)

slam:
  enabled:           true
  type:              ov2slam
  image:             ros2_perception_stack
  container_name:    slam_ov2slam
  cpu:               "2,3"
  startup_delay_sec: 15
  restart:           unless-stopped
  # Direct binary path, not "ros2 run" -- see ov2slam_oracle.yaml for why.
  command:           "/workspace/install/ov2slam/lib/ov2slam/ov2slam_node /workspace/camera_calib/hil_sim_ov2slam.yaml"
  topics:
    image_in: /ovcam/image_raw
    pose_out: /slam/pose
  remap:
    - "/ovcam/image_raw:=/ovcam/image_raw"
    - "vo_pose:=/slam/pose"
    - "point_cloud:=/slam/cloud"
