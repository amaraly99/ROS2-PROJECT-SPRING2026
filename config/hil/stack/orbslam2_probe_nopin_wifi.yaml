# HIL Stack Config -- orbslam2_probe, MONO, UNPINNED, over WiFi/FastRTPS.
# Built 2026-09-15 to give mono an unpinned arm comparable to the ALICIA stereo
# batch (all 5 stereo backends ran unpinned, see HANDOFF.md Part J). Base is
# orbslam2_probe_wifi.yaml, NOT orbslam2_probe_nopin.yaml -- the existing
# _nopin file predates the wifi network fix (still points at the dead wired
# link, reconfirmed down 2026-09-15) AND predates the g2o ld_prefix fix below,
# which the known-working ALICIA stereo config (orbslam2_stereo_oracle_nopin.yaml)
# still carries as of 2026-09-14, confirmed this session -- so it's still
# required, not superseded by any later rebuild. Only change from the _wifi
# base: slam.cpu "2,3" -> "". controller.cpu / detector.cpu deliberately left
# untouched: FIX-008 documents a real regression from detector/controller core
# contention, and both fields carry an unexplained "NEVER PUT ''''" warning
# that could not be verified this session either. Do not unpin them without
# investigating that warning first.
mode: benchmark

network:
  matlab_host_ip: 192.168.1.201
  interface:      ""
  dds:            fastrtps
  ros_domain_id:  0

detector:
  type:     oracle
  cpu:      "0" # NEVER PUT ""
  topics:
    image_in: /ovcam/image_raw
    out:      /yolo/detections

controller:
  type:       proportional
  # cpu "1" -> "0" (2026-09-15): matches all 5 ALICIA stereo arms and the 3 mono
  # OV2SLAM arms, making all 10 configs across both flights uniform on this axis.
  #
  # For THIS benchmark path the pin is INERT, and that is traced, not assumed:
  # run_matrix.py starts the stack with --hold-fsm, and run_stack_hil.sh hits its
  # HOLD_FSM block ("SLAM HELD -- camera + SLAM sidecar up, FSM NOT launched")
  # and exit 0s before ever calling launch_stack. detector.cpu/controller.cpu
  # only reach anything through LAUNCH_ARGS (run_stack_hil.sh:734), which is
  # consumed by launch_stack alone -- so with the FSM held, neither the oracle
  # detector node nor the controller process is ever started and neither pin is
  # applied. The drone flies slam_traj_probe.m's scripted trajectory by writing
  # sim_cmdvel into the MATLAB base workspace, never through ROS /cmd_vel. Of the
  # three cpu fields only slam.cpu is live here (run_stack_hil.sh:236, taskset on
  # the sidecar, which does start).
  #
  # Changed anyway for two reasons: it removes a mono-vs-stereo asymmetry that
  # would otherwise need a footnote in the write-up, and if this config is ever
  # reused in a mode where the stack DOES launch (--resume-fsm, init_gate, or
  # full closed-loop), "0" is the value matching every other arm.
  # detector.cpu was already "0" and is unchanged.
  cpu:        "0" # NEVER PUT ""
  gains_file: bench_proportional.yaml
  topics:
    detections_in: /yolo/detections
    cmd_out:       /cmd_vel

slam:
  enabled:           true
  type:              orbslam2
  image:             orbslam2_fixed
  container_name:    slam_orbslam2
  cpu:               ""     # NOPIN: unpinned to match ALICIA stereo protocol
  startup_delay_sec: 2
  restart:           unless-stopped

  setup_overlay: /workspace/src/orbslam2/install_stereo/setup.bash
  ld_prefix:     /workspace/src/orbslam2/lib:/workspace/src/orbslam2/Thirdparty/g2o/lib:/usr/local/lib:/opt/ros/jazzy/lib

  command: >-
    ros2 run orbslam mono
    /workspace/src/orbslam2/Vocabulary/ORBvoc.txt
    /workspace/src/orbslam2/ros2-ORB_SLAM2/src/monocular/hil_sim.yaml

  topics:
    image_in: /ovcam/image_raw
    pose_out: /slam/pose
  remap:
    - "camera:=/ovcam/image_raw"
    - "slam_pose:=/slam/pose"
    - "slam_tracking_state:=/slam/tracking_state"

init_gate:
  enabled: false
  module: orbslam2
  params:
    legs: [left, right, up_slow]
    leg_speed: 1.0
    leg_duration_sec: 0.50
    timeout_sec: 30
    ready_debounce: 2
