# h_vs (TS3) scouting — YOLO + Benhimane homography VS, no SLAM.
# Smoothest commands (~1.7 total variation). Requires Hailo HAT.
# (Nested schema; see full_ov2slam.yaml.)
mode: scout

network:
  matlab_host_ip: 192.168.1.201
  interface:      wlan0
  dds:            cyclonedds
  ros_domain_id:  0

detector:
  type:     yolo
  cpu:      "0"
  host_cpu: "1"
  yolo:
    hef:        /workspace/models/yolo26n_10h.hef
    confidence: 0.20

controller:
  type: h_vs
  cpu:  "0"

slam:
  enabled: false
