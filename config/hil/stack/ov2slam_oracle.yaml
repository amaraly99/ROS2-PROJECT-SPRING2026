# SLAM RMSE capture — OV2SLAM + ORACLE detector + Proportional controller (BENCHMARK).
# This is the TARGET-2 config: oracle detector + proportional controller drive a clean,
# repeatable approach while OV2SLAM runs; benchmark mode records /slam/pose vs the GT
# /sim/drone_pose into bags/run_ov2slam_oracle_<stamp>/ for offline ATE/RMSE.
# No Hailo HAT needed (oracle replaces YOLO). See full_ov2slam.yaml for the schema.
mode: benchmark

network:
  matlab_host_ip: 192.168.1.201
  interface:      wlan0
  dds:            cyclonedds
  ros_domain_id:  0

detector:
  type: oracle
  cpu:  "0"

controller:
  type: proportional
  cpu:  "0"

slam:
  enabled:           true
  type:              ov2slam
  image:             ros2_perception_stack
  container_name:    slam_ov2slam
  cpu:               "2,3"
  startup_delay_sec: 15
  restart:           unless-stopped
  command:           "ros2 run ov2slam ov2slam_node /workspace/camera_calib/hil_sim_ov2slam.yaml"
  topics:
    image_in: /ovcam/image_raw
    pose_out: /slam/pose
  remap:
    - "/ovcam/image_raw:=/ovcam/image_raw"
    - "vo_pose:=/slam/pose"
