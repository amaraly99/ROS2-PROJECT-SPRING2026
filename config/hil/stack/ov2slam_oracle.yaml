# SLAM RMSE capture — OV2SLAM + ORACLE detector + Proportional controller (BENCHMARK).
# This is the TARGET-2 config: oracle detector + proportional controller drive a clean,
# repeatable approach while OV2SLAM runs; benchmark mode records /slam/pose vs the GT
# /sim/drone_pose into bags/run_ov2slam_oracle_<stamp>/ for offline ATE/RMSE.
# No Hailo HAT needed (oracle replaces YOLO). See full_ov2slam.yaml for the schema.
mode: benchmark

network:
  matlab_host_ip: 192.168.137.1
  interface:      eth0
  dds:            cyclonedds
  ros_domain_id:  0

detector:
  type: oracle
  cpu:  "0"

controller:
  type: proportional
  cpu:  "0"

slam:
  enabled:           true
  type:              ov2slam
  image:             ros2_perception_stack
  container_name:    slam_ov2slam
  cpu:               "2,3"
  startup_delay_sec: 15
  restart:           unless-stopped
  command:           "ros2 run ov2slam ov2slam_node /workspace/camera_calib/hil_sim_ov2slam.yaml"
  topics:
    image_in: /ovcam/image_raw
    pose_out: /slam/pose
  remap:
    - "/ovcam/image_raw:=/ovcam/image_raw"
    - "vo_pose:=/slam/pose"
    - "slam_tracking_state:=/slam/tracking_state"

init_gate:
  # SLAM-warmup gate: runs before the FSM/detector/controller stack launches,
  # does a translation-only warmup (left/right/up, elapsed-time legs only, no
  # arrival-tolerance chasing) so OV2SLAM gets real parallax before the drone
  # commits to the normal approach. Readiness here is OV2SLAM's own
  # bvision_init_ flag (SlamParams), republished as the same std_msgs/Int32
  # /slam/tracking_state contract ORB-SLAM2 uses (2=ready) -- coarser than
  # ORB-SLAM2's 4-state enum (OV2SLAM has no LOST/RELOCALIZING concept, it
  # fully resets instead), which is fine since the gate only checks for
  # the ready value. See src/init_gate/ and src/ov2slam_ros/src/ov2slam_node.cpp.
  enabled: true
